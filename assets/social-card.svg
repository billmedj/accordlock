    <text x="94" y="120" fill="#F4F1E9" font-size="30" font-weight="650" letter-spacing="-.4">AccordLock</text>
    <text x="94" y="256" fill="#F4F1E9" font-size="58" font-weight="620" letter-spacing="-2.2">
      <tspan x="94" dy="0">Control what autonomous</tspan>
      <tspan x="94" dy="70">agents can change.</tspan>
    </text>
    <text x="94" y="424" fill="#A8ACB7" font-size="24" font-weight="400">
      <tspan x="94" dy="0">Bind each protected action to an approved task,</tspan>
      <tspan x="94" dy="36">relevant state, and single-use execution grant.</tspan>
    </text>
    <text x="94" y="548" fill="#8491FF" font-size="17" font-weight="650" letter-spacing="2.4">ENGINEERING ALPHA</text>
    <text x="330" y="548" fill="#696E79" font-size="17" font-weight="600" letter-spacing="2.1">APACHE-2.0</text>
  </g>
