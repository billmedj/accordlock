<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">AccordLock</title>
  <desc id="desc">Execution control for autonomous agents.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="32" x2="1180" y2="608" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171A21"/>
      <stop offset="1" stop-color="#0F1116"/>
    </linearGradient>
    <linearGradient id="signal" x1="1081" y1="282" x2="1119" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5264E8"/>
      <stop offset="1" stop-color="#8491FF"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <rect x="32" y="32" width="1216" height="576" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
  <path d="M1280 166H1108c-118 0-194 76-194 194v20c0 118-76 194-194 194H548" fill="none" stroke="#7E8492" stroke-opacity=".08" stroke-width="92" stroke-linecap="round"/>
