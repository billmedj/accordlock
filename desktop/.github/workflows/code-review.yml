# AccordLock is derived from the Apache-2.0 Goose project.
# The inherited workflow persisted an OIDC token in an uploaded temp directory
# and executed review code in an upstream image. It is intentionally quarantined.
name: "AccordLock publication quarantine: automated code review"

on:
  workflow_dispatch:
    inputs:
      publication_profile:
        required: true
        type: choice
        options: [accordlock-distribution]

permissions:
  contents: read

env:
  ACCORDLOCK_PUBLICATION_DISABLED: "true"

jobs:
  fail-closed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          PUBLICATION_PROFILE: ${{ inputs.publication_profile }}
        run: |
          test "$PUBLICATION_PROFILE" = "accordlock-distribution"
          python3 scripts/check_accordlock_publication.py
          echo "Automated review is disabled until its credential and runner boundary is redesigned." >&2
          exit 1
