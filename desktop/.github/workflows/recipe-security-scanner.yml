# Modified by AccordLock contributors; see UPSTREAM.md.
# AccordLock is derived from the Apache-2.0 Goose project.
# This inherited automation is disabled until AccordLock owns its security boundary.
name: "AccordLock publication quarantine: inherited recipe scanner"

on:
  workflow_dispatch:
    inputs:
      publication_profile:
        required: true
        type: choice
        options: [accordlock-distribution]

permissions:
  contents: read

env:
  ACCORDLOCK_PUBLICATION_DISABLED: "true"

jobs:
  fail-closed:
    runs-on: ubuntu-latest
    steps:
      - name: Keep inherited automation disabled
        env:
          PUBLICATION_PROFILE: ${{ inputs.publication_profile }}
        shell: bash
        run: |
          test "$PUBLICATION_PROFILE" = "accordlock-distribution"
          echo "inherited recipe scanner is disabled for the AccordLock distribution." >&2
          exit 1
