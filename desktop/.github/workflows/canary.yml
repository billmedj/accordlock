# Modified by AccordLock contributors; see UPSTREAM.md.
# AccordLock is derived from the Apache-2.0 Goose project.
# Automatic upstream canaries must never publish from this distribution.
name: "AccordLock publication quarantine: canary"

on:
  workflow_dispatch:
    inputs:
      publication_profile:
        description: "Only the hardened AccordLock profile is recognized"
        required: true
        type: choice
        options:
          - accordlock-distribution

permissions:
  contents: read

env:
  ACCORDLOCK_PUBLICATION_DISABLED: "true"

jobs:
  fail-closed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate publication quarantine
        env:
          PUBLICATION_PROFILE: ${{ inputs.publication_profile }}
        run: |
          test "$PUBLICATION_PROFILE" = "accordlock-distribution"
          python3 scripts/check_accordlock_publication.py
          echo "Canary publication is disabled until a signed AccordLock pipeline exists." >&2
          exit 1
