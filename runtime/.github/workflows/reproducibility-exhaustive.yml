name: reproducibility-exhaustive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproducibility-exhaustive:
    name: reproducibility-exhaustive
    runs-on: [self-hosted, linux, x64, accordlock-tlc]
    timeout-minutes: 7140
    services:
      postgres:
        image: postgres@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: accordlock_test_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accordlock_test_v2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      ACCORDLOCK_POSTGRES_MODE: external
      ACCORDLOCK_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/accordlock_test_v2
      TLA2TOOLS_JAR: ${{ github.workspace }}/.local/tools/tla2tools.jar

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and components
        run: rustup show active-toolchain

      - name: Verify Python
        run: python3 --version

      - name: Install Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch checksum-pinned TLC
        run: python3 scripts/fetch_tla2tools.py --output "$TLA2TOOLS_JAR"

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked --root .local/tools/cargo-audit

      - name: Fetch repository-pinned RustSec database
        shell: bash
        run: |
          if [ ! -d .local/rustsec-advisory-db/.git ]; then
            git clone https://github.com/RustSec/advisory-db.git .local/rustsec-advisory-db
          fi
          git -C .local/rustsec-advisory-db remote set-url origin https://github.com/RustSec/advisory-db.git
          git -C .local/rustsec-advisory-db fetch --prune origin main
          rustsec_commit="$(tr -d '\r\n' < scripts/rustsec-advisory-db.commit)"
          git -C .local/rustsec-advisory-db checkout --detach "$rustsec_commit"

      - name: Run fail-closed exhaustive reproducibility suite
        env:
          ACCORDLOCK_TEST_POSTGRES_V14_RESET: DROP_PUBLIC_SCHEMA_OF_ACCORDLOCK_TEST_V2
        run: sh scripts/run-all.sh
