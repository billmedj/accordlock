[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "accordlock-assurance"
version = "0.1.0"
description = "Traceability validation for AccordLock assurance claims"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
accordlock-assurance = "accordlock_assurance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["accordlock_assurance"]
