name: Reproducibility smoke

on:
  pull_request:
    paths:
      - "runtime/**"
      - "assurance/**"
      - ".github/workflows/reproducibility.yml"
  push:
    branches:
      - main
    paths:
      - "runtime/**"
      - "assurance/**"
      - ".github/workflows/reproducibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-reproducibility:
    name: Rust, TLC, PostgreSQL, and supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: accordlock_test_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d accordlock_test_v2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      ACCORDLOCK_POSTGRES_MODE: external
      ACCORDLOCK_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/accordlock_test_v2
      TLA2TOOLS_JAR: ${{ github.workspace }}/runtime/.local/tools/tla2tools.jar

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Activate the repository-pinned Rust toolchain
        working-directory: runtime
        run: rustup show active-toolchain

      - name: Verify Python
        run: python3 --version

      - name: Fetch checksum-pinned TLC
        working-directory: runtime
        run: python3 scripts/fetch_tla2tools.py --output "$TLA2TOOLS_JAR"

      - name: Install pinned cargo-audit
        working-directory: runtime
        run: cargo install cargo-audit --version 0.22.2 --locked --root .local/tools/cargo-audit

      - name: Fetch the repository-pinned RustSec database
        working-directory: runtime
        shell: bash
        run: |
          git clone https://github.com/RustSec/advisory-db.git .local/rustsec-advisory-db
          rustsec_commit="$(tr -d '\r\n' < scripts/rustsec-advisory-db.commit)"
          git -C .local/rustsec-advisory-db checkout --detach "$rustsec_commit"

      - name: Run the fail-closed reproducibility suite
        working-directory: runtime
        env:
          ACCORDLOCK_TLA_MODE: smoke
          ACCORDLOCK_TEST_POSTGRES_V14_RESET: DROP_PUBLIC_SCHEMA_OF_ACCORDLOCK_TEST_V2
        run: sh scripts/run-all.sh
