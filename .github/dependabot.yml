version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /runtime
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /desktop
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /desktop/ui
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /desktop/oidc-proxy
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
